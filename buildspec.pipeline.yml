version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR
      - test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret in build environment"; exit 1; }
      - test -n "$AUTH_JWT_SECRET" || { echo "Missing AUTH_JWT_SECRET secret in build environment"; exit 1; }
      - test -n "$NODE_ENV" || { echo "Missing NODE_ENV secret in build environment"; exit 1; }
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%/*}"
      - IMAGE_TAG="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)"
      - if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="latest"; fi
  build:
    commands:
      - echo Building the Docker image
      - docker build -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .
  post_build:
    commands:
      - echo Pushing Docker images to ECR
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$ECS_CONTAINER_NAME" "$ECR_REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - buildspec.migrate.yml
