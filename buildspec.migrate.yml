version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - 'test -n "$DATABASE_ADMIN_URL" || { echo "Missing DATABASE_ADMIN_URL secret in migrate environment"; exit 1; }'
      - 'test -n "$RESET_MIGRATIONS" || true'
      - 'NODE_MAJOR=$(node -p "process.versions.node.split(\".\")[0]") && [ "$NODE_MAJOR" -gt 20 ] || { echo "Node version must be >20. Found: $(node -v)"; exit 1; }'
      - 'export DATABASE_URL="$DATABASE_ADMIN_URL"'
      - 'echo "Installing dependencies for migration"'
      - 'npm ci'
  build:
    commands:
      - 'if [ -n "$RESET_MIGRATIONS" ]; then echo "RESET_MIGRATIONS is set; resetting and replaying all migrations"; npx prisma migrate reset --force --skip-generate --skip-seed --schema=./prisma/schema.prisma; else echo "Running prisma migrate deploy"; npx prisma migrate deploy --schema=./prisma/schema.prisma; fi'
