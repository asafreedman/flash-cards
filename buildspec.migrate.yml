version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - 'test -n "$DATABASE_ADMIN_URL" || { echo "Missing DATABASE_ADMIN_URL secret in migrate environment"; exit 1; }'
      - 'test -n "$APP_DB_USERNAME" || { echo "Missing APP_DB_USERNAME secret in migrate environment"; exit 1; }'
      - 'test -n "$APP_DB_PASSWORD" || { echo "Missing APP_DB_PASSWORD secret in migrate environment"; exit 1; }'
      - 'NODE_MAJOR=$(node -p "process.versions.node.split(\".\")[0]") && [ "$NODE_MAJOR" -gt 20 ] || { echo "Node version must be >20. Found: $(node -v)"; exit 1; }'
      - 'export DATABASE_URL="$DATABASE_ADMIN_URL"'
      - 'echo "Installing dependencies for migration"'
      - 'npm ci'
  build:
    commands:
      - 'echo "Ensuring application DB role exists"'
      - 'echo "DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''${APP_DB_USERNAME}'') THEN EXECUTE format(''CREATE ROLE %I LOGIN PASSWORD %L'', ''${APP_DB_USERNAME}'', ''${APP_DB_PASSWORD}''); ELSE EXECUTE format(''ALTER ROLE %I WITH LOGIN PASSWORD %L'', ''${APP_DB_USERNAME}'', ''${APP_DB_PASSWORD}''); END IF; END $$;" | npx prisma db execute --stdin'
      - 'echo "Running prisma migrate deploy"'
      - 'npx prisma migrate deploy --schema=./prisma/schema.prisma'
