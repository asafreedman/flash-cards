version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
  pre_build:
    commands:
      - 'test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL secret in migrate environment"; exit 1; }'
      - 'NODE_MAJOR=$(node -p "process.versions.node.split(\".\")[0]") && [ "$NODE_MAJOR" -gt 20 ] || { echo "Node version must be >20. Found: $(node -v)"; exit 1; }'
      - 'echo "Installing dependencies for migration"'
      - 'npm ci'
  build:
    commands:
      - 'echo "Ensuring schema/table privileges for the migration role"'
      - 'echo "GRANT USAGE ON SCHEMA public TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "GRANT CREATE ON SCHEMA public TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO CURRENT_USER;" | npx prisma db execute --stdin'
      - 'echo "Running prisma migrate deploy"'
      - 'npx prisma migrate deploy --schema=./prisma/schema.prisma'
